name: 部署图鉴网站

# 当 gugedonghua 分支有新提交时自动部署; 也支持手动触发
on:
  push:
    branches: ["gugedonghua"]
  workflow_dispatch:

# 授予部署 Pages 所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包网站文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: "网页"

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4